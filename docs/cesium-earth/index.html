<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<title>Earth bathymetry · Cesium 版</title>
	<meta name="description" content="用 CesiumJS 实现的海底地形地球——与同项目的 Three.js 复刻版做对照">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="data:,">

	<script>window.CESIUM_BASE_URL = 'https://unpkg.com/cesium@1.145.0/Build/Cesium/';</script>
	<link rel="stylesheet" href="https://unpkg.com/cesium@1.145.0/Build/Cesium/Widgets/widgets.css">
	<script src="https://unpkg.com/cesium@1.145.0/Build/Cesium/Cesium.js"></script>

	<style>
		:root {
			--bg: #0B0E14;
			--surface: #151A23;
			--primary: #E6EAF2;
			--secondary: #8A93A6;
			--accent: #2DD4BF;
			--line: #232B38;
			--warning: #F2B26B;
		}
		html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg); }
		body {
			color: var(--primary);
			font-family: 'IBM Plex Sans', 'PingFang SC', 'Hiragino Sans GB', 'Source Han Sans SC',
				'Noto Sans SC', 'Microsoft YaHei UI', 'Microsoft YaHei', sans-serif;
			font-size: 14px;
			line-height: 1.7;
		}
		#globe { position: absolute; inset: 0; }

		#panel {
			position: absolute; top: 16px; left: 16px; z-index: 10;
			width: 280px; max-width: calc(100vw - 32px);
			background: var(--surface);
			border: 1px solid var(--line);
			border-radius: 10px;
			padding: 16px;
			box-sizing: border-box;
		}
		#panel h1 {
			margin: 0 0 4px;
			font-size: 16px; font-weight: 600; line-height: 1.4;
		}
		#panel .sub { color: var(--secondary); font-size: 13px; margin: 0 0 16px; }
		.row { margin-bottom: 16px; }
		.row:last-child { margin-bottom: 0; }
		.row label {
			display: flex; justify-content: space-between; align-items: baseline;
			color: var(--secondary); font-size: 13px; margin-bottom: 8px;
		}
		.row label b {
			color: var(--accent); font-weight: 500;
			font-family: 'IBM Plex Mono', 'JetBrains Mono', ui-monospace, 'PingFang SC', 'Hiragino Sans GB', 'Source Han Sans SC', 'Noto Sans SC', 'Microsoft YaHei UI', 'Microsoft YaHei', monospace;
		}
		input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }
		.btns { display: flex; gap: 8px; flex-wrap: wrap; }
		button {
			flex: 1 1 auto; min-height: 32px; padding: 6px 12px;
			background: transparent; color: var(--primary);
			border: 1px solid var(--line); border-radius: 6px;
			font: inherit; font-size: 13px; cursor: pointer;
		}
		button:hover { border-color: var(--accent); color: var(--accent); }
		button[aria-pressed=true] { border-color: var(--accent); color: var(--accent); }

		#note {
			margin-top: 16px; padding-top: 16px;
			border-top: 1px solid var(--line);
			color: var(--secondary); font-size: 13px;
		}
		#note a { color: var(--accent); }

		#loading {
			position: absolute; inset: 0; z-index: 20;
			display: flex; align-items: center; justify-content: center;
			background: var(--bg); color: var(--secondary);
		}
		#status {
			position: absolute; right: 16px; bottom: 16px; z-index: 10;
			color: var(--secondary); font-size: 13px; text-align: right;
			font-family: 'IBM Plex Mono', 'JetBrains Mono', ui-monospace, 'PingFang SC', 'Hiragino Sans GB', 'Source Han Sans SC', 'Noto Sans SC', 'Microsoft YaHei UI', 'Microsoft YaHei', monospace;
		}
		/* Cesium 自带的版权行压在右下,挪开免得和状态行叠 */
		.cesium-widget-credits { display: none !important; }
		@media (max-width: 600px) {
			#panel { width: auto; right: 16px; }
			#status { display: none; }
		}
	</style>
</head>
<body>
	<div id="globe"></div>

	<div id="panel" hidden>
		<h1>Earth bathymetry · Cesium 版</h1>
		<p class="sub">与 Three.js 复刻版同源数据的对照实现</p>

		<div class="row">
			<label for="exag">地形垂直夸张 <b id="exagVal">10×</b></label>
			<input type="range" id="exag" min="1" max="40" step="1" value="10">
		</div>

		<div class="row btns">
			<button id="btnWater" aria-pressed="true">水色</button>
			<button id="btnWaves" aria-pressed="true">波光</button>
			<button id="btnLight" aria-pressed="true">日照</button>
			<button id="btnHome">复位</button>
		</div>

		<div id="note">
			高程与影像来自本项目 Three.js 版的同一批 NASA Blue Marble 贴图（4K）。
			水色按 Three.js 版同一套吸收公式按水深烘进影像，波浪与日光反射用 Cesium 自带的海洋效果。
			<a href="../earth-bathymetry/">← 对比 Three.js 版</a>
		</div>
	</div>

	<div id="status" hidden></div>
	<div id="loading">正在装配地形…</div>

	<script>
	(async function () {
		const loadingEl = document.getElementById('loading');
		const panelEl = document.getElementById('panel');
		const statusEl = document.getElementById('status');

		const TEX = '../earth-bathymetry/textures/';
		const HEIGHT_SRC = TEX + 'bathymetry_bw_composite_4k.jpg';
		const IMAGERY_SRC = TEX + 'bathymetry_diffuse_4k.jpg';

		// --------------------------------------------------------------
		// 高程解码
		// 这批合成图把陆地和海洋编码成两段独立的灰阶斜坡,中间在海岸线处有个台阶。
		// 常数是拿已知地点(马里亚纳/大西洋中部/撒哈拉/南极高原/喜马拉雅)反解出来的近似值。
		const SEA_TOP = 130;      // 海洋段的上端 = 海平面
		const SEA_FLOOR = 8000;   // 灰度 0 对应的水深(米)
		const LAND_BASE = 143;    // 陆地段的下端 = 海平面
		const LAND_TOP = 7500;    // 灰度 255 对应的海拔(米)

		function decode(g) {
			if (g <= SEA_TOP) return -(SEA_TOP - g) / SEA_TOP * SEA_FLOOR;
			if (g >= LAND_BASE) return (g - LAND_BASE) / (255 - LAND_BASE) * LAND_TOP;
			return 0;             // 海岸带
		}

		// --------------------------------------------------------------
		// 把高程图读进像素缓冲

		function loadImage(src) {
			return new Promise((res, rej) => {
				const im = new Image();
				im.onload = () => res(im);
				im.onerror = () => rej(new Error('取不到 ' + src));
				im.src = src;
			});
		}

		loadingEl.textContent = '正在读取贴图…';
		const [hImg, dImg] = await Promise.all([loadImage(HEIGHT_SRC), loadImage(IMAGERY_SRC)]);
		const hcv = document.createElement('canvas');
		hcv.width = hImg.width; hcv.height = hImg.height;
		const hctx = hcv.getContext('2d', { willReadFrequently: true });
		hctx.drawImage(hImg, 0, 0);
		const HW = hcv.width, HH = hcv.height;
		const hpx = hctx.getImageData(0, 0, HW, HH).data;

		// 双线性采样,免得瓦片之间出现台阶
		function elevationAt(lon, lat) {
			let u = (lon + 180) / 360;
			u = u - Math.floor(u);                       // 经度回绕
			const v = (90 - lat) / 180;
			const x = u * (HW - 1);
			const y = Math.min(Math.max(v, 0), 1) * (HH - 1);
			const x0 = Math.floor(x), y0 = Math.floor(y);
			const x1 = (x0 + 1) % HW, y1 = Math.min(y0 + 1, HH - 1);
			const fx = x - x0, fy = y - y0;
			const g = (px, py) => hpx[(py * HW + px) * 4];
			const top = decode(g(x0, y0)) * (1 - fx) + decode(g(x1, y0)) * fx;
			const bot = decode(g(x0, y1)) * (1 - fx) + decode(g(x1, y1)) * fx;
			return top * (1 - fy) + bot * fy;
		}

		function grayAt(lon, lat) {
			let u = (lon + 180) / 360;
			u -= Math.floor(u);
			const v = Math.min(Math.max((90 - lat) / 180, 0), 1);
			return hpx[(Math.min(HH - 1, (v * HH) | 0) * HW + Math.min(HW - 1, (u * HW) | 0)) * 4];
		}

		// --------------------------------------------------------------
		// 水色:把 Three.js 版的水下消光公式按「垂直水深」烘进海洋像素
		// Three.js 版里地表半径 = 50 + 灰度/255×10,海面在 55.5,即海平面落在灰度 140.25。
		// 光在水里按 R/G/B 各自衰减(红光最先被吸收,所以越深越蓝),水体本身再向外散射出
		// 由浅青到深蓝的颜色。参数与 Three.js 版第一档水色一致。
		// 与 Three.js 版的差别:那边厚度按视线穿过水体的实际路程算(贴近球边缘会更深),
		// 这里只能按垂直水深算 —— 烘在贴图里的东西不知道你从哪个角度看。
		const WATER = {
			seaGray: 140.25,
			unitScale: 12,
			ext: [6, 30, 32],
			visibility: 25,
			fade: 0.8,
			floorDim: 0.35,
			sunlight: 2.0,           // Three.js 版里海底先被太阳照亮再进水,这里用常数近似
			shallow: [0.10, 0.42, 0.46],
			deep: [0.004, 0.020, 0.026],
			exposure: 2.5
		};

		const srgbToLin = new Float32Array(256);
		for (let i = 0; i < 256; i++) {
			const c = i / 255;
			srgbToLin[i] = c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
		}
		const LIN_STEPS = 4096;
		const linToSrgb = new Uint8Array(LIN_STEPS + 1);
		for (let i = 0; i <= LIN_STEPS; i++) {
			const c = i / LIN_STEPS;
			const v = c <= 0.0031308 ? c * 12.92 : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
			linToSrgb[i] = Math.round(Math.min(1, Math.max(0, v)) * 255);
		}

		// 水的效果只取决于该点的高程灰度,按 256 档预先算好
		const wT = new Float32Array(256 * 3);     // 海底颜色的透射率
		const wAdd = new Float32Array(256 * 3);   // 水体自身散射出来的颜色
		const wMix = new Float32Array(256);       // 岸线过渡:1 = 全水,0 = 陆地
		for (let g = 0; g < 256; g++) {
			const th = Math.max(0, (WATER.seaGray - g) / 255 * 10) * WATER.unitScale;
			const inscatter = 1 - Math.exp(-th / WATER.visibility);
			const deepMix = 1 - Math.exp(-th * WATER.fade / WATER.visibility);
			for (let c = 0; c < 3; c++) {
				wT[g * 3 + c] = Math.exp(-th / WATER.ext[c]) * WATER.floorDim * WATER.sunlight;
				wAdd[g * 3 + c] = (WATER.shallow[c] + (WATER.deep[c] - WATER.shallow[c]) * deepMix) * inscatter;
			}
			wMix[g] = Math.min(1, Math.max(0, (WATER.seaGray + 0.5 - g) / 2));
		}

		// 陆地调子:关掉地面大气后陆地偏暗(亚马孙实测只有 Three.js 版的约 0.4 倍亮度)。
		// 按线性光提亮 2.6 倍,再用一段肩部把白色压回 1,雪和沙漠不会过曝发白
		const LAND = { gain: 2.6 };
		const landLUT = new Uint8Array(256);
		{
			const shoulder = (LAND.gain - 1) / LAND.gain;
			for (let v = 0; v < 256; v++) {
				const x = srgbToLin[v] * LAND.gain;
				const y = x / (1 + x * shoulder);
				landLUT[v] = linToSrgb[Math.min(LIN_STEPS, (y * LIN_STEPS) | 0)];
			}
		}

		// 同时烘两层:raw = 只调亮(海底是灰白浮雕),water = 调亮的陆地 + 按水深算出来的海水
		// raw 直接写回源缓冲,省下一整张 4K 的内存
		function bakeLayers(src) {
			const DW = src.width, DH = src.height, s = src.data;
			const wat = new ImageData(DW, DH), w = wat.data;
			const sx = HW / DW, sy = HH / DH, E = WATER.exposure;
			for (let y = 0; y < DH; y++) {
				const row = Math.min(HH - 1, (y * sy) | 0) * HW;
				for (let x = 0; x < DW; x++) {
					const g = hpx[(row + Math.min(HW - 1, (x * sx) | 0)) * 4];
					const m = wMix[g];
					const i = (y * DW + x) * 4;
					for (let c = 0; c < 3; c++) {
						const orig = s[i + c];
						const toned = landLUT[orig];
						if (m === 0) {
							w[i + c] = toned;
						} else {
							let v = srgbToLin[orig] * wT[g * 3 + c] + wAdd[g * 3 + c];
							v = (v * E) / (1 + v * E);                 // Reinhard,同 Three.js 版
							w[i + c] = toned + (linToSrgb[(v * LIN_STEPS) | 0] - toned) * m;
						}
						s[i + c] = toned;
					}
					w[i + 3] = 255;
				}
			}
			return wat;
		}

		loadingEl.textContent = '正在调水色…';
		await new Promise((r) => setTimeout(r, 0));       // 先让提示画出来
		const dcv = document.createElement('canvas');
		dcv.width = dImg.width; dcv.height = dImg.height;
		const dctx = dcv.getContext('2d', { willReadFrequently: true });
		dctx.drawImage(dImg, 0, 0);
		const dData = dctx.getImageData(0, 0, dcv.width, dcv.height);
		const bakeStart = performance.now();
		const wData = bakeLayers(dData);
		const bakeMs = Math.round(performance.now() - bakeStart);
		const toUrl = async (img) => {
			dctx.putImageData(img, 0, 0);
			return URL.createObjectURL(await new Promise((r) => dcv.toBlob(r, 'image/jpeg', 0.92)));
		};
		const RAW_SRC = await toUrl(dData);
		const BAKED_SRC = await toUrl(wData);

		// 水体掩膜:告诉 Cesium 哪里是海,它才会在那里跑自带的波浪法线与日光高光
		const MASK = 256;
		function waterMaskFor(rect) {
			const m = new Uint8Array(MASK * MASK);
			let any = false, all = true;
			for (let j = 0; j < MASK; j++) {           // 第 0 行是北边,与 quantized-mesh 约定一致
				const lat = Cesium.Math.toDegrees(Cesium.Math.lerp(rect.north, rect.south, (j + 0.5) / MASK));
				for (let i = 0; i < MASK; i++) {
					const lon = Cesium.Math.toDegrees(Cesium.Math.lerp(rect.west, rect.east, (i + 0.5) / MASK));
					const v = (wMix[grayAt(lon, lat)] * 255) | 0;
					m[j * MASK + i] = v;
					if (v) any = true;
					if (v !== 255) all = false;
				}
			}
			if (!any) return new Uint8Array([0]);        // 整块是陆地
			if (all) return new Uint8Array([255]);       // 整块是海
			return m;
		}

		// --------------------------------------------------------------
		// 自定义地形源:Cesium 按需要哪块就来问,我们现算现给

		const tilingScheme = new Cesium.GeographicTilingScheme();
		const TILE = 64;
		// 4K 源图到第 6 级就没有更多细节了,再往下细分只是徒增瓦片
		const MAX_LEVEL = 6;

		function heightsFor(rect) {
			const out = new Float32Array(TILE * TILE);
			for (let j = 0; j < TILE; j++) {
				const lat = Cesium.Math.toDegrees(
					Cesium.Math.lerp(rect.north, rect.south, j / (TILE - 1)));
				for (let i = 0; i < TILE; i++) {
					const lon = Cesium.Math.toDegrees(
						Cesium.Math.lerp(rect.west, rect.east, i / (TILE - 1)));
					out[j * TILE + i] = elevationAt(lon, lat);
				}
			}
			return out;
		}

		const terrainProvider = new Cesium.CustomHeightmapTerrainProvider({
			width: TILE,
			height: TILE,
			tilingScheme: tilingScheme,
			callback: (x, y, level) => heightsFor(tilingScheme.tileXYToRectangle(x, y, level))
		});
		// CustomHeightmapTerrainProvider 自己不带水体掩膜。接管取瓦片这一步,把掩膜一起塞进去
		terrainProvider.requestTileGeometry = function (x, y, level) {
			const rect = tilingScheme.tileXYToRectangle(x, y, level);
			return Promise.resolve(new Cesium.HeightmapTerrainData({
				buffer: heightsFor(rect),
				width: TILE,
				height: TILE,
				waterMask: waterMaskFor(rect)
			}));
		};
		Object.defineProperty(terrainProvider, 'hasWaterMask', { get: () => true });

		// --------------------------------------------------------------
		// 影像:同一批贴图铺满整球,全程不碰 Cesium ion(无 token、可离线)

		const imageryOpts = {
			rectangle: Cesium.Rectangle.MAX_VALUE,
			tileWidth: dImg.width,
			tileHeight: dImg.height
		};
		const rawImagery = await Cesium.SingleTileImageryProvider.fromUrl(RAW_SRC, imageryOpts);
		const bakedImagery = await Cesium.SingleTileImageryProvider.fromUrl(BAKED_SRC, imageryOpts);

		const viewer = new Cesium.Viewer('globe', {
			baseLayer: new Cesium.ImageryLayer(rawImagery),
			terrainProvider: terrainProvider,
			// 下面这些控件要么依赖 ion,要么对这个演示没用
			geocoder: false, baseLayerPicker: false, sceneModePicker: false,
			navigationHelpButton: false, homeButton: false, fullscreenButton: false,
			timeline: false, animation: false, infoBox: false, selectionIndicator: false,
			creditContainer: document.createElement('div')
		});

		const scene = viewer.scene;
		const globe = scene.globe;

		scene.verticalExaggeration = 10;
		scene.verticalExaggerationRelativeHeight = 0;   // 以海平面为基准放大
		globe.enableLighting = true;
		globe.maximumScreenSpaceError = 3;
		// Cesium 的日照跟真实时间走。把钟停在太阳正对大西洋的时刻,
		// 否则默认打开就是一片夜面 —— 这是它「按真实天文算」的代价。
		viewer.clock.currentTime = Cesium.JulianDate.fromIso8601('2026-09-10T15:00:00Z');
		viewer.clock.shouldAnimate = false;
		globe.baseColor = Cesium.Color.fromCssColorString('#0B0E14');
		// 球外那圈天空光晕保留;地面大气关掉 —— 它给整个球面罩一层偏青的雾,
		// 实测把深海从 (69,137,143) 抬到 (119,182,196),水色全被冲淡
		scene.skyAtmosphere.show = true;
		globe.showGroundAtmosphere = false;
		scene.screenSpaceCameraController.minimumZoomDistance = 200000;

		// 烘好水色的那层叠在原始影像上面,开关它就能对比「有水 / 只有海底浮雕」
		const waterLayer = viewer.imageryLayers.addImageryProvider(bakedImagery);

		// Cesium 自带的海洋效果:按水体掩膜在海面跑动态波浪法线和太阳高光
		globe.showWaterEffect = true;
		globe.zoomedOutOceanSpecularIntensity = 0.45;

		const HOME = Cesium.Cartesian3.fromDegrees(-40, 10, 24000000);
		function goHome() {
			viewer.camera.flyTo({ destination: HOME, duration: 1.4 });
		}
		viewer.camera.setView({ destination: HOME });

		// --------------------------------------------------------------
		// 控件

		const exag = document.getElementById('exag');
		const exagVal = document.getElementById('exagVal');
		exag.addEventListener('input', () => {
			scene.verticalExaggeration = Number(exag.value);
			exagVal.textContent = exag.value + '×';
		});

		function toggle(id, apply) {
			const btn = document.getElementById(id);
			btn.addEventListener('click', () => {
				const on = btn.getAttribute('aria-pressed') !== 'true';
				btn.setAttribute('aria-pressed', String(on));
				apply(on);
			});
		}
		toggle('btnWater', (on) => { waterLayer.show = on; });
		toggle('btnWaves', (on) => { globe.showWaterEffect = on; });
		toggle('btnLight', (on) => { globe.enableLighting = on; });

		document.getElementById('btnHome').addEventListener('click', goHome);

		// --------------------------------------------------------------
		// 状态行:鼠标底下那一点的经纬度与海拔 —— Three.js 那版给不出这个

		const handler = new Cesium.ScreenSpaceEventHandler(scene.canvas);
		handler.setInputAction((movement) => {
			const carto = scene.camera.pickEllipsoid(movement.endPosition, Cesium.Ellipsoid.WGS84);
			if (!carto) { statusEl.textContent = ''; return; }
			const c = Cesium.Cartographic.fromCartesian(carto);
			const lon = Cesium.Math.toDegrees(c.longitude);
			const lat = Cesium.Math.toDegrees(c.latitude);
			const h = Math.round(elevationAt(lon, lat));
			// 高程是从灰度贴图反解的近似值,不是权威高程数据,所以标 ≈
			statusEl.textContent =
				lat.toFixed(2) + '°, ' + lon.toFixed(2) + '°　' +
				(h >= 0 ? '海拔 ≈ ' + h : '水深 ≈ ' + (-h)) + ' m';
		}, Cesium.ScreenSpaceEventType.MOUSE_MOVE);

		// --------------------------------------------------------------

		loadingEl.remove();
		panelEl.hidden = false;
		statusEl.hidden = false;

		window.APP = {
			Cesium, viewer, scene, elevationAt, decode, goHome, waterLayer, WATER, LAND,
			get info() {
				return {
					exaggeration: scene.verticalExaggeration,
					lighting: globe.enableLighting,
					water: waterLayer.show,
					waves: globe.showWaterEffect,
					bakeMs: bakeMs,
					tilesLoaded: globe.tilesLoaded,
					// 实测有没有真的打到 ion 的服务器(库里带着默认 token,光看 token 说明不了问题)
					ionRequests: performance.getEntriesByType('resource')
						.filter((r) => /cesium\.com/.test(r.name)).length,
					maxLevel: MAX_LEVEL
				};
			}
		};
	})().catch((err) => {
		document.getElementById('loading').textContent = '起不来:' + err.message;
		console.error(err);
	});
	</script>
</body>
</html>
