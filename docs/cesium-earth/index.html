<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<title>Earth bathymetry · Cesium 版</title>
	<meta name="description" content="用 CesiumJS 实现的海底地形地球——与同项目的 Three.js 复刻版做对照">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="data:,">

	<!-- Cesium 库不在这里同步引入:由下面脚本挑镜像动态加载,贴图同时开始下载,不用排在 5.9 MB 的库后面 -->

	<style>
		:root {
			--bg: #0B0E14;
			--surface: #151A23;
			--primary: #E6EAF2;
			--secondary: #8A93A6;
			--accent: #2DD4BF;
			--line: #232B38;
			--warning: #F2B26B;
		}
		html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg); }
		body {
			color: var(--primary);
			font-family: 'IBM Plex Sans', 'PingFang SC', 'Hiragino Sans GB', 'Source Han Sans SC',
				'Noto Sans SC', 'Microsoft YaHei UI', 'Microsoft YaHei', sans-serif;
			font-size: 14px;
			line-height: 1.7;
		}
		#globe { position: absolute; inset: 0; }

		#panel {
			position: absolute; top: 16px; left: 16px; z-index: 10;
			width: 280px; max-width: calc(100vw - 32px);
			background: var(--surface);
			border: 1px solid var(--line);
			border-radius: 10px;
			padding: 16px;
			box-sizing: border-box;
		}
		#panel h1 {
			margin: 0 0 4px;
			font-size: 16px; font-weight: 600; line-height: 1.4;
		}
		#panel .sub { color: var(--secondary); font-size: 13px; margin: 0 0 16px; }
		.row { margin-bottom: 16px; }
		.row:last-child { margin-bottom: 0; }
		.row label, .row .cap {
			display: flex; justify-content: space-between; align-items: baseline;
			color: var(--secondary); font-size: 13px; margin-bottom: 8px;
		}
		.row label b, .row .cap b {
			color: var(--accent); font-weight: 500;
			font-family: 'IBM Plex Mono', 'JetBrains Mono', ui-monospace, 'PingFang SC', 'Hiragino Sans GB', 'Source Han Sans SC', 'Noto Sans SC', 'Microsoft YaHei UI', 'Microsoft YaHei', monospace;
		}
		input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }
		input[type=range]:disabled { opacity: 0.4; }
		.btns { display: flex; gap: 8px; flex-wrap: wrap; }
		button {
			flex: 1 1 auto; min-height: 32px; padding: 6px 12px;
			background: transparent; color: var(--primary);
			border: 1px solid var(--line); border-radius: 6px;
			font: inherit; font-size: 13px; cursor: pointer;
		}
		button:hover { border-color: var(--accent); color: var(--accent); }
		button[aria-pressed=true] { border-color: var(--accent); color: var(--accent); }
		/* 分段选择:等宽平分一行,五个两字按钮也放得下 */
		.seg { flex-wrap: nowrap; }
		.seg button { flex: 1 1 0; padding: 6px 0; }

		#note {
			margin-top: 16px; padding-top: 16px;
			border-top: 1px solid var(--line);
			color: var(--secondary); font-size: 13px;
		}
		#note a { color: var(--accent); }

		#loading {
			position: absolute; inset: 0; z-index: 20;
			display: flex; align-items: center; justify-content: center;
			background: var(--bg); color: var(--secondary);
		}
		#status {
			position: absolute; right: 16px; bottom: 16px; z-index: 10;
			color: var(--secondary); font-size: 13px; text-align: right;
			font-family: 'IBM Plex Mono', 'JetBrains Mono', ui-monospace, 'PingFang SC', 'Hiragino Sans GB', 'Source Han Sans SC', 'Noto Sans SC', 'Microsoft YaHei UI', 'Microsoft YaHei', monospace;
		}
		/* Cesium 自带的版权行压在右下,挪开免得和状态行叠 */
		.cesium-widget-credits { display: none !important; }
		@media (max-width: 600px) {
			#panel { width: auto; right: 16px; }
			#status { display: none; }
		}
	</style>
</head>
<body>
	<div id="globe"></div>

	<div id="panel" hidden>
		<h1>Earth bathymetry · Cesium 版</h1>
		<p class="sub">与 Three.js 复刻版同源数据的对照实现</p>

		<div class="row">
			<div class="cap" id="viewCap">视图 <b>V 键切换</b></div>
			<div class="btns seg" id="viewSeg" role="group" aria-labelledby="viewCap"></div>
		</div>

		<div class="row">
			<label for="exag">地形垂直夸张 <b id="exagVal">10×</b></label>
			<input type="range" id="exag" min="1" max="40" step="1" value="10">
		</div>

		<div class="row">
			<div class="cap" id="waterCap">水色 <b>W 键轮换</b></div>
			<div class="btns seg" id="waterSeg" role="group" aria-labelledby="waterCap"></div>
		</div>

		<div class="row">
			<div class="cap" id="qualityCap">画质 <b>U 键轮换</b></div>
			<div class="btns seg" id="qualitySeg" role="group" aria-labelledby="qualityCap"></div>
		</div>

		<div class="row btns">
			<button id="btnWater" aria-pressed="true">水体</button>
			<button id="btnWaves" aria-pressed="true">波光</button>
			<button id="btnLight" aria-pressed="true">日照</button>
			<button id="btnHome">复位</button>
		</div>

		<div id="note">
			高程与影像来自本项目 Three.js 版的同一批 NASA Blue Marble 贴图（4K）。
			水体用的是 Three.js 版那套着色器，移植成 Cesium 的后处理：按视线穿过海水的实际路程分通道吸收，
			加上折射、波浪与日光高光。
			<a href="../earth-bathymetry/">← 对比 Three.js 版</a>
		</div>
	</div>

	<div id="status" hidden></div>
	<div id="loading">正在装配地形…</div>

	<script>
	// ------------------------------------------------------------------
	// 水体着色器 —— earth-bathymetry(Three.js 版)那套水面着色器的 Cesium 移植。
	// Three.js 版是把水球单独画一遍、读地形那一遍的深度;Cesium 里没有「另画一个水球」
	// 这一层,所以改成全屏后处理:每个像素自己算视线打到海平面椭球的位置,再和深度缓冲里
	// 地形的距离相减,得到视线在水里走了多远。其余(分通道吸收、浅→深水色、折射、
	// 两层滚动的法线贴图、日光高光、菲涅尔)与 Three.js 版逐项对应。
	const WATER_FS = `
		uniform sampler2D colorTexture;
		uniform sampler2D depthTexture;
		uniform sampler2D normalMap;
		uniform float time;
		uniform float exaggeration;
		uniform float lightOn;
		uniform float wavesOn;
		uniform vec3 radiiScale;       // R0 / 椭球三轴半径
		uniform float R0;
		uniform vec3 extinction;
		uniform float visibility;
		uniform float fadeSpeed;
		uniform float floorDim;
		uniform vec3 shallowColor;
		uniform vec3 deepColor;
		uniform float exposure;
		uniform float depthK;
		uniform float depthPow;
		uniform float refractionScale;
		uniform float normalScale;
		uniform float specular;
		uniform float shininess;
		uniform float fresnelScale;
		uniform float shoreWidth;      // 世界米(已夸张)
		uniform float rimCap;          // 真实米
		uniform float debugMode;
		uniform float sceneMode;       // 0 = 3D 球面,1 = 2D 平面,其他(视图切换过程中)直接放行
		uniform sampler2D heightMap;   // 2D 用:量不出深度,直接查高程图
		uniform vec2 mapOrigin;        // 2D 用:屏幕左下角的经纬度(弧度)
		uniform vec2 mapDu;            // 2D 用:沿屏幕横向走满一屏的经纬度增量
		uniform vec2 mapDv;            // 2D 用:沿屏幕纵向走满一屏的经纬度增量
		in vec2 v_textureCoordinates;

		vec3 toLin(vec3 c) { return pow(max(c, vec3(0.0)), vec3(2.2)); }
		vec3 toSrgb(vec3 c) { return pow(max(c, vec3(0.0)), vec3(1.0 / 2.2)); }

		vec3 viewDirEC(vec2 uv) {
			vec4 e = czm_inverseProjection * vec4(uv * 2.0 - 1.0, 0.0, 1.0);
			return normalize(e.xyz / e.w);
		}

		// 沿视线到深度缓冲里那个东西的距离。直接解对数深度 —— 反解成 0..1 的窗口深度
		// 在行星尺度上会全挤在 1 附近,float 精度撑不住
		float geomDistance(vec2 uv, vec3 dirEC, out bool hit) {
			float logZ = texture(depthTexture, uv).r;
			hit = logZ < 0.999999;
			float zEye = pow(2.0, logZ * czm_log2FarDepthFromNearPlusOne) - 1.0 + czm_currentFrustum.x;
			return zEye / max(-dirEC.z, 1e-4);
		}

		// 视线与海平面椭球求交。先按三轴缩放成单位球,再以「地球半径」为单位解,float 才够用
		bool seaHit(vec3 dirWC, out float tNear, out float tFar) {
			vec3 o = czm_viewerPositionWC / R0 * radiiScale;
			vec3 d = dirWC * radiiScale;
			float a = dot(d, d);
			float b = 2.0 * dot(o, d);
			float c = dot(o, o) - 1.0;
			float disc = b * b - 4.0 * a * c;
			if (disc < 0.0) return false;
			float s = sqrt(disc);
			tNear = (-b - s) / (2.0 * a) * R0;
			tFar = (-b + s) / (2.0 * a) * R0;
			return tNear > 0.0;
		}

		// 某个世界坐标点在海平面以下的垂直深度(换算回真实米)
		float depthBelowSea(vec3 pWC) {
			float r = length(pWC / R0 * radiiScale);
			return max((1.0 - r) * R0 / exaggeration, 0.0);
		}

		// 波浪:同一张法线贴图两层反向滚动,UV 按经纬度铺,与 Three.js 版球面 UV 一致。返回切空间法线
		vec3 waveNormal(float lon, float lat) {
			vec2 suv = vec2(lon / czm_twoPi + 0.5, lat / czm_pi + 0.5);
			vec2 uv1 = suv * vec2(4.0, 2.0) + vec2(time * 0.010, time * 0.006);
			vec2 uv2 = suv * vec2(4.0, 2.0) * 1.83 + vec2(-time * 0.008, time * 0.011);
			vec3 n1 = texture(normalMap, fract(uv1)).xyz * 2.0 - 1.0;
			vec3 n2 = texture(normalMap, fract(uv2)).xyz * 2.0 - 1.0;
			return normalize(vec3((n1.xy + n2.xy) * 0.5 * normalScale * wavesOn, 1.0));
		}

		// 水体着色,3D、2D 共用。th = 光学厚度;n = 大地法线;N = 带波浪的法线;V = 指向观察者
		vec3 shadeWater(vec3 floorCol, float th, vec3 n, vec3 N, vec3 V) {
			vec3 L = normalize(czm_lightDirectionWC);
			vec3 T = exp(-th / extinction);
			float inscatter = 1.0 - exp(-th / visibility);
			float deepMix = 1.0 - exp(-th * fadeSpeed / visibility);
			vec3 waterCol = mix(shallowColor, deepColor, deepMix);

			// Three.js 版的光总从正面来;这里有真实晨昏线,水体散射也得跟着日照走
			float ndl = dot(n, L);
			float lit = mix(1.0, 0.12 + 0.88 * smoothstep(-0.15, 0.3, ndl), lightOn);
			vec3 col = floorCol * floorDim * T + waterCol * inscatter * lit;

			vec3 H = normalize(L + V);
			float spec = pow(max(dot(N, H), 0.0), shininess);
			float fres = pow(1.0 - max(dot(n, V), 0.0), 5.0);
			float sunSide = mix(1.0, smoothstep(-0.1, 0.25, ndl), lightOn);
			col += vec3(specular) * spec * sunSide * wavesOn;
			col += vec3(0.85, 0.9, 0.95) * fres * fresnelScale * lit;

			col = col * exposure / (1.0 + col * exposure);           // Reinhard,同 Three.js 版
			return toSrgb(col);
		}

		// ---- 2D 平面 ----
		// 正交俯视 + 等经纬度投影,屏幕上的点到经纬度是个仿射映射(每帧由脚本按相机算好传进来)。
		// 2D 下地形被压平,深度缓冲量不出水深,改为直接查高程图;视线垂直向下,穿水路程就是水深
		vec2 lonLatAt(vec2 uv) { return mapOrigin + mapDu * uv.x + mapDv * uv.y; }

		// 高程图灰度 → 水深(米,陆地与海岸带为 0),常数与脚本里的 decode 一致
		float seaDepthAt(vec2 ll) {
			vec2 t = vec2(fract(ll.x / czm_twoPi + 0.5), clamp(ll.y / czm_pi + 0.5, 0.0, 1.0));
			float g = texture(heightMap, t).r * 255.0;
			return max(130.0 - g, 0.0) / 130.0 * 8000.0;
		}

		vec4 water2D(vec2 uv, vec4 src) {
			vec2 ll = lonLatAt(uv);
			if (abs(ll.y) > czm_piOverTwo) return src;          // 地图上下边界以外
			float d0 = seaDepthAt(ll);
			float land = 1.0 - smoothstep(0.0, 60.0, d0);       // 60 米 ≈ 高程图一个灰阶
			if (land > 0.999) return src;

			float cl = cos(ll.y);
			vec3 n = vec3(cl * cos(ll.x), cl * sin(ll.x), sin(ll.y));
			vec3 east = vec3(-sin(ll.x), cos(ll.x), 0.0);
			vec3 north = cross(n, east);
			vec3 nt = waveNormal(ll.x, ll.y);
			vec3 N = normalize(east * nt.x + north * nt.y + n * nt.z);

			// 折射:正上方俯视,屏幕横纵就是东、北两个方向;偏到陆地上就不偏
			vec2 ruv = uv + nt.xy * refractionScale * wavesOn;
			float depth = seaDepthAt(lonLatAt(ruv));
			vec3 floorCol = toLin(texture(colorTexture, ruv).rgb);
			if (depth < 60.0) { floorCol = toLin(src.rgb); depth = d0; }

			float th = depthK * depth * pow(max(depth, 30.0), depthPow - 1.0);
			if (debugMode > 0.5) return vec4(vec3(depth / 10000.0), 1.0);
			return vec4(mix(shadeWater(floorCol, th, n, N, n), src.rgb, land), 1.0);
		}

		void main(void) {
			vec2 uv = v_textureCoordinates;
			vec4 src = texture(colorTexture, uv);
			if (sceneMode > 1.5) { out_FragColor = src; return; }
			if (sceneMode > 0.5) { out_FragColor = water2D(uv, src); return; }

			vec3 dirEC = viewDirEC(uv);
			vec3 dirWC = normalize(czm_inverseViewRotation * dirEC);

			float tN, tF;
			if (!seaHit(dirWC, tN, tF)) { out_FragColor = src; return; }

			bool hit0;
			float g0 = geomDistance(uv, dirEC, hit0);
			// 地形在海面前面 = 陆地;在后面 = 海底
			float land = hit0 ? 1.0 - smoothstep(-shoreWidth, shoreWidth, g0 - tN) : 0.0;
			if (land > 0.999) { out_FragColor = src; return; }

			vec3 p = czm_viewerPositionWC + dirWC * tN;
			vec3 n = normalize(p * radiiScale * radiiScale);          // 大地法线 ∝ p / 半径²
			vec3 east = normalize(vec3(-n.y, n.x, 0.0) + vec3(1e-6, 0.0, 0.0));
			vec3 north = cross(n, east);
			vec3 V = -dirWC;

			float lon = atan(p.y, p.x);
			float lat = asin(clamp(n.z, -1.0, 1.0));
			vec3 nt = waveNormal(lon, lat);
			vec3 N = normalize(east * nt.x + north * nt.y + n * nt.z);

			// 折射:按波浪法线在屏幕上偏一点去取海底。偏过去的那个像素要用它自己那条视线的
			// 海面距离来算水深 —— 拿本像素的海面距离去减,越靠边缘两者差得越多,水会平白变厚
			vec3 NEC = czm_viewRotation * N;
			vec2 ruv = uv + NEC.xy * refractionScale * wavesOn;
			vec3 dirR = viewDirEC(ruv);
			vec3 dirRWC = normalize(czm_inverseViewRotation * dirR);
			bool hitR;
			float gR = geomDistance(ruv, dirR, hitR);
			float tNR, tFR;
			bool seaR = seaHit(dirRWC, tNR, tFR);
			vec3 floorCol = toLin(texture(colorTexture, ruv).rgb);
			float gUse = gR, tUse = tNR;
			bool hitUse = hitR;
			vec3 dUse = dirRWC;
			if (!hitR || !seaR || gR < tNR) { floorCol = toLin(src.rgb); gUse = g0; tUse = tN; hitUse = hit0; dUse = dirWC; }

			// 光在水里走的路程(真实米)。深度这条轴沿用 Three.js 版的「不按比例」观感:
			// 垂直方向按水深的幂次压缩(浅滩也能看出颜色),斜着看时路程照实拉长,边缘因此变深
			float path;
			float th;
			if (!hitUse) {
				path = min((tF - tN) / exaggeration, rimCap);
				th = depthK * path * pow(4000.0, depthPow - 1.0);
				floorCol = vec3(0.0);
			} else {
				path = max(gUse - tUse, 0.0) / exaggeration;
				float vd = max(depthBelowSea(czm_viewerPositionWC + dUse * gUse), 30.0);
				th = depthK * path * pow(vd, depthPow - 1.0);
			}

			if (debugMode > 0.5) { out_FragColor = vec4(vec3(path / 10000.0), 1.0); return; }

			out_FragColor = vec4(mix(shadeWater(floorCol, th, n, N, V), src.rgb, land), 1.0);
		}
	`;

	// Cesium 库从哪取:先走国内的 npmmirror(实测 5.9 MB 的库 0.5 s 下完,unpkg 要 3~5 s),
	// 取不到再退回 unpkg。CESIUM_BASE_URL 跟着实际用上的那个走,Workers 和 Assets 也从那里取
	const CESIUM_CDNS = [
		'https://registry.npmmirror.com/cesium/1.145.0/files/Build/Cesium/',
		'https://unpkg.com/cesium@1.145.0/Build/Cesium/'
	];
	function loadCesium(i = 0) {
		const base = CESIUM_CDNS[i];
		window.CESIUM_BASE_URL = base;
		const css = document.createElement('link');
		css.rel = 'stylesheet';
		css.href = base + 'Widgets/widgets.css';
		const js = document.createElement('script');
		js.src = base + 'Cesium.js';
		// 样式取不到不致命,只等它结束;库本体取不到才换下一个源
		const cssDone = new Promise((r) => { css.onload = css.onerror = r; });
		const jsDone = new Promise((r, j) => { js.onload = r; js.onerror = j; });
		document.head.append(css, js);
		return Promise.all([cssDone, jsDone]).then(() => base, () => {
			css.remove(); js.remove();
			if (i + 1 < CESIUM_CDNS.length) return loadCesium(i + 1);
			throw new Error('Cesium 库加载失败');
		});
	}

	(async function () {
		const loadingEl = document.getElementById('loading');
		const panelEl = document.getElementById('panel');
		const statusEl = document.getElementById('status');

		const TEX = '../earth-bathymetry/textures/';
		const HEIGHT_SRC = TEX + 'bathymetry_bw_composite_4k.jpg';
		// 陆地提亮后的影像,离线烘好(以前每次打开都在浏览器里现调现压 JPEG,M4 上也要 1.1 s)。
		// 调子:原 4K 贴图按线性光提亮 2.6 倍,再用肩部 x/(1+x·(G−1)/G) 把白色压回 1,存 WebP q85。
		// 提亮的原因:关掉地面大气后陆地偏暗(亚马孙实测只有 Three.js 版的约 0.4 倍);
		// 海底浮雕一起提亮 —— 水体着色器拿它当海底颜色,正对应 Three.js 版里被照亮的海床
		const IMAGERY_SRC = 'textures/diffuse_toned_4k.webp';
		const NORMAL_SRC = TEX + 'water-normal.jpg';

		// --------------------------------------------------------------
		// 高程解码
		// 这批合成图把陆地和海洋编码成两段独立的灰阶斜坡,中间在海岸线处有个台阶。
		// 常数是拿已知地点(马里亚纳/大西洋中部/撒哈拉/南极高原/喜马拉雅)反解出来的近似值。
		const SEA_TOP = 130;      // 海洋段的上端 = 海平面
		const SEA_FLOOR = 8000;   // 灰度 0 对应的水深(米)
		const LAND_BASE = 143;    // 陆地段的下端 = 海平面
		const LAND_TOP = 7500;    // 灰度 255 对应的海拔(米)

		function decode(g) {
			if (g <= SEA_TOP) return -(SEA_TOP - g) / SEA_TOP * SEA_FLOOR;
			if (g >= LAND_BASE) return (g - LAND_BASE) / (255 - LAND_BASE) * LAND_TOP;
			return 0;             // 海岸带
		}

		function loadImage(src) {
			return new Promise((res, rej) => {
				const im = new Image();
				im.onload = () => res(im);
				im.onerror = () => rej(new Error('取不到 ' + src));
				im.src = src;
			});
		}

		loadingEl.textContent = '正在加载地球库与贴图…';
		const timing = {};
		const stamp = (k) => (v) => { timing[k] = Math.round(performance.now()); return v; };
		// 高程图、影像、Cesium 库三样并行下载,谁也不等谁
		const [hImg, imageryBlob, cdn] = await Promise.all([
			loadImage(HEIGHT_SRC).then(stamp('heightMs')),
			fetch(IMAGERY_SRC).then((r) => {
				if (!r.ok) throw new Error('取不到 ' + IMAGERY_SRC);
				return r.blob();
			}).then(stamp('imageryMs')),
			loadCesium().then(stamp('cesiumMs'))
		]);

		const HW = hImg.width, HH = hImg.height;
		// 只留灰度那一个通道(16 MB),整张 RGBA(64 MB)用完就放掉;灰度 → 米 先查好表
		const hpx = new Uint8Array(HW * HH);
		{
			const hcv = document.createElement('canvas');
			hcv.width = HW; hcv.height = HH;
			const hctx = hcv.getContext('2d', { willReadFrequently: true });
			hctx.drawImage(hImg, 0, 0);
			const rgba = hctx.getImageData(0, 0, HW, HH).data;
			for (let i = 0; i < hpx.length; i++) hpx[i] = rgba[i * 4];
		}
		const HEIGHT_OF = new Float32Array(256);
		for (let g = 0; g < 256; g++) HEIGHT_OF[g] = decode(g);

		// 双线性采样,免得瓦片之间出现台阶
		function elevationAt(lon, lat) {
			let u = (lon + 180) / 360;
			u = u - Math.floor(u);                       // 经度回绕
			const v = (90 - lat) / 180;
			const x = u * (HW - 1);
			const y = Math.min(Math.max(v, 0), 1) * (HH - 1);
			const x0 = Math.floor(x), y0 = Math.floor(y);
			const x1 = (x0 + 1) % HW, y1 = Math.min(y0 + 1, HH - 1);
			const fx = x - x0, fy = y - y0;
			const g = (px, py) => HEIGHT_OF[hpx[py * HW + px]];
			const top = g(x0, y0) * (1 - fx) + g(x1, y0) * fx;
			const bot = g(x0, y1) * (1 - fx) + g(x1, y1) * fx;
			return top * (1 - fy) + bot * fy;
		}

		// --------------------------------------------------------------
		// 自定义地形源:Cesium 按需要哪块就来问,我们现算现给

		const tilingScheme = new Cesium.GeographicTilingScheme();
		const TILE = 64;
		// 4K 源图到第 6 级就没有更多细节了,再往下细分只是徒增瓦片
		const MAX_LEVEL = 6;

		function heightsFor(rect) {
			const out = new Float32Array(TILE * TILE);
			for (let j = 0; j < TILE; j++) {
				const lat = Cesium.Math.toDegrees(
					Cesium.Math.lerp(rect.north, rect.south, j / (TILE - 1)));
				for (let i = 0; i < TILE; i++) {
					const lon = Cesium.Math.toDegrees(
						Cesium.Math.lerp(rect.west, rect.east, i / (TILE - 1)));
					out[j * TILE + i] = elevationAt(lon, lat);
				}
			}
			return out;
		}

		const terrainProvider = new Cesium.CustomHeightmapTerrainProvider({
			width: TILE,
			height: TILE,
			tilingScheme: tilingScheme,
			callback: (x, y, level) => heightsFor(tilingScheme.tileXYToRectangle(x, y, level))
		});

		// --------------------------------------------------------------
		// 影像:同一批贴图铺满整球,全程不碰 Cesium ion(无 token、可离线)

		const imagery = await Cesium.SingleTileImageryProvider.fromUrl(URL.createObjectURL(imageryBlob), {
			rectangle: Cesium.Rectangle.MAX_VALUE,
			tileWidth: 4096,
			tileHeight: 2048
		});

		const viewer = new Cesium.Viewer('globe', {
			baseLayer: new Cesium.ImageryLayer(imagery),
			terrainProvider: terrainProvider,
			// 下面这些控件要么依赖 ion,要么对这个演示没用
			geocoder: false, baseLayerPicker: false, sceneModePicker: false,
			navigationHelpButton: false, homeButton: false, fullscreenButton: false,
			timeline: false, animation: false, infoBox: false, selectionIndicator: false,
			creditContainer: document.createElement('div')
		});

		const scene = viewer.scene;
		const globe = scene.globe;

		scene.verticalExaggeration = 10;
		scene.verticalExaggerationRelativeHeight = 0;   // 以海平面为基准放大
		globe.enableLighting = true;
		// Cesium 的日照跟真实时间走。把钟停在太阳正对大西洋的时刻,
		// 否则默认打开就是一片夜面 —— 这是它「按真实天文算」的代价。
		viewer.clock.currentTime = Cesium.JulianDate.fromIso8601('2026-09-10T15:00:00Z');
		viewer.clock.shouldAnimate = false;
		globe.baseColor = Cesium.Color.fromCssColorString('#0B0E14');
		// 球外那圈天空光晕保留;地面大气关掉 —— 它给整个球面罩一层偏青的雾,水色会被冲淡
		scene.skyAtmosphere.show = true;
		globe.showGroundAtmosphere = false;
		// 水交给下面的着色器,Cesium 自带的海面效果关掉免得叠两层
		globe.showWaterEffect = false;
		// 默认情况下 Cesium 画完地球就把地形深度丢掉,只留一块「地平线深度板」挡住地球背面的东西,
		// 后处理拿到的深度因此全是那块板(实测整个球面都解出 24,836 km,正好是地平线圆所在的平面)。
		// 打开对地形的深度测试,地形深度才会留在深度缓冲里,水体着色器才量得出水有多厚
		globe.depthTestAgainstTerrain = true;
		scene.screenSpaceCameraController.minimumZoomDistance = 200000;

		// --------------------------------------------------------------
		// 水体后处理。参数取自 Three.js 版第一档水色;深度那条轴见着色器里的注释

		const R0 = Cesium.Ellipsoid.WGS84.maximumRadius;
		const radii = Cesium.Ellipsoid.WGS84.radii;
		const WATER = {
			extinction: new Cesium.Cartesian3(6, 30, 32),
			visibility: 25,
			fadeSpeed: 0.8,
			floorDim: 0.35,
			shallowColor: new Cesium.Cartesian3(0.10, 0.42, 0.46),
			deepColor: new Cesium.Cartesian3(0.004, 0.020, 0.026),
			exposure: 2.5,
			depthK: 0.252,        // 4000 米深 → Three.js 版里同一处的光学厚度 36
			depthPow: 0.6,        // 200 米浅滩 → 光学厚度 6,与 Three.js 版浅滩一致
			refractionScale: 0.0275,
			normalScale: 2.0,
			specular: 0.12,
			shininess: 160,
			fresnelScale: 0.05,
			rimCap: 13600,        // 球边缘只穿过水、没碰到海底的视线,路程封顶(真实米)
			debug: 0
		};
		let wavesOn = true;

		// 2D 下屏幕 → 经纬度的仿射映射,每帧按相机现算。等经纬度投影:x = 经度 × 赤道半径,y = 纬度 × 赤道半径;
		// 2D 相机的位置、right、up 都在这个投影平面里,正交视锥的四边就是屏幕四边
		const MAP2D = { origin: new Cesium.Cartesian2(), du: new Cesium.Cartesian2(), dv: new Cesium.Cartesian2() };
		scene.preRender.addEventListener(() => {
			if (scene.mode !== Cesium.SceneMode.SCENE2D) return;
			const cam = scene.camera, f = cam.frustum, p = cam.position, r = cam.right, u = cam.up;
			const w = f.right - f.left, h = f.top - f.bottom;
			MAP2D.origin.x = (p.x + r.x * f.left + u.x * f.bottom) / R0;
			MAP2D.origin.y = (p.y + r.y * f.left + u.y * f.bottom) / R0;
			MAP2D.du.x = r.x * w / R0;
			MAP2D.du.y = r.y * w / R0;
			MAP2D.dv.x = u.x * h / R0;
			MAP2D.dv.y = u.y * h / R0;
		});

		const waterStage = scene.postProcessStages.add(new Cesium.PostProcessStage({
			name: 'bathymetryWater',
			fragmentShader: WATER_FS,
			uniforms: {
				normalMap: NORMAL_SRC,
				time: () => performance.now() / 1000,
				exaggeration: () => Math.max(scene.verticalExaggeration, 0.001),
				lightOn: () => (globe.enableLighting ? 1 : 0),
				wavesOn: () => (wavesOn ? 1 : 0),
				radiiScale: new Cesium.Cartesian3(R0 / radii.x, R0 / radii.y, R0 / radii.z),
				R0: R0,
				extinction: () => WATER.extinction,
				visibility: () => WATER.visibility,
				fadeSpeed: () => WATER.fadeSpeed,
				floorDim: () => WATER.floorDim,
				shallowColor: () => WATER.shallowColor,
				deepColor: () => WATER.deepColor,
				exposure: () => WATER.exposure,
				depthK: () => WATER.depthK,
				depthPow: () => WATER.depthPow,
				refractionScale: () => WATER.refractionScale,
				normalScale: () => WATER.normalScale,
				specular: () => WATER.specular,
				shininess: () => WATER.shininess,
				fresnelScale: () => WATER.fresnelScale,
				// 岸线过渡带随夸张倍数缩放:夸张越大,海床离海面越远,过渡带也可以越宽
				shoreWidth: () => Math.max(30 * scene.verticalExaggeration, 60),
				rimCap: () => WATER.rimCap,
				debugMode: () => WATER.debug,
				sceneMode: () => (scene.mode === Cesium.SceneMode.SCENE3D ? 0 : scene.mode === Cesium.SceneMode.SCENE2D ? 1 : 2),
				heightMap: HEIGHT_SRC,
				mapOrigin: () => MAP2D.origin,
				mapDu: () => MAP2D.du,
				mapDv: () => MAP2D.dv
			}
		}));

		const HOME = Cesium.Cartesian3.fromDegrees(-40, 10, 24000000);
		const WORLD = Cesium.Rectangle.fromDegrees(-180, -90, 180, 90);
		function goHome(duration = 1.4) {
			const destination = scene.mode === Cesium.SceneMode.SCENE2D ? WORLD : HOME;
			viewer.camera.flyTo({ destination, duration });
		}
		viewer.camera.setView({ destination: HOME });

		// --------------------------------------------------------------
		// 控件

		const exag = document.getElementById('exag');
		const exagVal = document.getElementById('exagVal');
		exag.addEventListener('input', () => {
			scene.verticalExaggeration = Number(exag.value);
			exagVal.textContent = exag.value + '×';
		});

		function toggle(id, apply) {
			const btn = document.getElementById(id);
			btn.addEventListener('click', () => {
				const on = btn.getAttribute('aria-pressed') !== 'true';
				btn.setAttribute('aria-pressed', String(on));
				apply(on);
			});
		}
		toggle('btnWater', (on) => { waterStage.enabled = on; });
		toggle('btnWaves', (on) => { wavesOn = on; });
		toggle('btnLight', (on) => { globe.enableLighting = on; });
		document.getElementById('btnHome').addEventListener('click', () => goHome());

		// 水色:Three.js 版那五档,参数逐项照搬(深度那条轴的映射与档位无关,不用跟着调)
		const WATER_PRESETS = [
			{ name: '清澈', floor: 0.35, visibility: 25, fade: 0.8, shallow: [0.10, 0.42, 0.46], deep: [0.004, 0.020, 0.026], ext: [6, 30, 32] },
			{ name: '通透', floor: 0.45, visibility: 35, fade: 0.7, shallow: [0.10, 0.42, 0.46], deep: [0.004, 0.020, 0.026], ext: [8, 40, 44] },
			{ name: '浑浊', floor: 0.30, visibility: 10, fade: 1.0, shallow: [0.10, 0.42, 0.46], deep: [0.004, 0.020, 0.026], ext: [2.5, 12, 13] },
			{ name: '琥珀', floor: 0.35, visibility: 25, fade: 0.8, shallow: [0.62, 0.40, 0.08], deep: [0.10, 0.012, 0.004], ext: [32, 16, 8] },
			{ name: '灰色', floor: 0.40, visibility: 30, fade: 0.8, shallow: [0.55, 0.55, 0.55], deep: [0.03, 0.03, 0.03], ext: [26, 26, 26] }
		];
		// 画质:标准按 CSS 像素渲染;高清按屏幕真实像素(高分屏上清晰一倍);超清再翻一倍 ——
		// 对应 Three.js 版的 ultra / photo。瓦片细分阈值跟着收紧。
		// 渲染缓冲封顶约 1600 万像素,和 Three.js 版一样,免得超清把显存吃爆
		const QUALITY = [
			{ name: '标准', dpr: false, scale: 1, sse: 3 },
			{ name: '高清', dpr: true, scale: 1, sse: 2 },
			{ name: '超清', dpr: true, scale: 2, sse: 1.5 }
		];
		let waterIndex = 0, qualityIndex = 0;

		function segmented(id, items, onPick) {
			const box = document.getElementById(id);
			const btns = items.map((it, i) => {
				const b = document.createElement('button');
				b.textContent = it.name;
				b.addEventListener('click', () => onPick(i));
				box.append(b);
				return b;
			});
			return (i) => btns.forEach((b, k) => b.setAttribute('aria-pressed', String(k === i)));
		}
		const markWater = segmented('waterSeg', WATER_PRESETS, (i) => applyWaterPreset(i));
		const markQuality = segmented('qualitySeg', QUALITY, (i) => applyQuality(i));

		function applyWaterPreset(i) {
			const p = WATER_PRESETS[i];
			WATER.floorDim = p.floor;
			WATER.visibility = p.visibility;
			WATER.fadeSpeed = p.fade;
			WATER.shallowColor = new Cesium.Cartesian3(...p.shallow);
			WATER.deepColor = new Cesium.Cartesian3(...p.deep);
			WATER.extinction = new Cesium.Cartesian3(...p.ext);
			waterIndex = i;
			markWater(i);
		}
		function applyQuality(i) {
			const q = QUALITY[i];
			viewer.useBrowserRecommendedResolution = !q.dpr;
			const px = window.innerWidth * window.innerHeight * ((q.dpr ? window.devicePixelRatio : 1) * q.scale) ** 2;
			viewer.resolutionScale = px > 16e6 ? q.scale * Math.sqrt(16e6 / px) : q.scale;
			globe.maximumScreenSpaceError = q.sse;
			qualityIndex = i;
			markQuality(i);
		}
		applyWaterPreset(0);
		applyQuality(0);
		window.addEventListener('resize', () => applyQuality(qualityIndex));

		// 视图:3D 球面 / 2D 平面(等经纬度投影的世界地图)。2D 下地形被压平,垂直夸张不起作用。
		// 切换不走 Cesium 的变形动画:变形途中既不是球也不是平面,水体没法算,只能露出没有水的海床
		const VIEWS = [{ name: '3D 球面' }, { name: '2D 平面' }];
		let viewIndex = 0;
		const markView = segmented('viewSeg', VIEWS, (i) => applyView(i));
		function applyView(i) {
			if (i === viewIndex) return;
			viewIndex = i;
			markView(i);
			exag.disabled = i === 1;
			if (i === 1) scene.morphTo2D(0);
			else scene.morphTo3D(0);
		}
		scene.morphComplete.addEventListener(() => goHome(0));   // 换完回到该视图的默认视角
		markView(0);

		document.addEventListener('keydown', (e) => {
			if (e.ctrlKey || e.metaKey || e.altKey) return;
			const k = e.key.toLowerCase();
			if (k === 'w') applyWaterPreset((waterIndex + 1) % WATER_PRESETS.length);
			else if (k === 'u') applyQuality((qualityIndex + 1) % QUALITY.length);
			else if (k === 'v') applyView(1 - viewIndex);
		});

		// --------------------------------------------------------------
		// 状态行:鼠标底下那一点的经纬度与海拔 —— Three.js 那版给不出这个

		const handler = new Cesium.ScreenSpaceEventHandler(scene.canvas);
		handler.setInputAction((movement) => {
			const carto = scene.camera.pickEllipsoid(movement.endPosition, Cesium.Ellipsoid.WGS84);
			if (!carto) { statusEl.textContent = ''; return; }
			const c = Cesium.Cartographic.fromCartesian(carto);
			const lon = Cesium.Math.toDegrees(c.longitude);
			const lat = Cesium.Math.toDegrees(c.latitude);
			const h = Math.round(elevationAt(lon, lat));
			// 高程是从灰度贴图反解的近似值,不是权威高程数据,所以标 ≈
			statusEl.textContent =
				lat.toFixed(2) + '°, ' + lon.toFixed(2) + '°　' +
				(h >= 0 ? '海拔 ≈ ' + h : '水深 ≈ ' + (-h)) + ' m';
		}, Cesium.ScreenSpaceEventType.MOUSE_MOVE);

		// --------------------------------------------------------------

		loadingEl.remove();
		panelEl.hidden = false;
		statusEl.hidden = false;
		timing.readyMs = Math.round(performance.now());
		// 首屏瓦片全部到位的时刻,量加载性能用
		const offTiles = globe.tileLoadProgressEvent.addEventListener((queued) => {
			if (queued === 0 && globe.tilesLoaded) { timing.tilesMs = Math.round(performance.now()); offTiles(); }
		});

		window.APP = {
			Cesium, viewer, scene, elevationAt, decode, goHome, waterStage, WATER, applyWaterPreset, applyQuality, applyView, MAP2D,
			get info() {
				return {
					exaggeration: scene.verticalExaggeration,
					lighting: globe.enableLighting,
					water: waterStage.enabled,
					waterReady: waterStage.ready,
					waves: wavesOn,
					waterPreset: WATER_PRESETS[waterIndex].name,
					quality: QUALITY[qualityIndex].name,
					view: VIEWS[viewIndex].name,
					sceneMode: scene.mode,
					pixelRatio: scene.pixelRatio,
					canvas: [scene.canvas.width, scene.canvas.height],
					logDepth: scene.logarithmicDepthBuffer,
					cdn: cdn,
					timing: timing,
					tilesLoaded: globe.tilesLoaded,
					// 实测有没有真的打到 ion 的服务器(库里带着默认 token,光看 token 说明不了问题)
					ionRequests: performance.getEntriesByType('resource')
						.filter((r) => /cesium\.com/.test(r.name)).length,
					maxLevel: MAX_LEVEL
				};
			}
		};
	})().catch((err) => {
		document.getElementById('loading').textContent = '起不来:' + err.message;
		console.error(err);
	});
	</script>
</body>
</html>
